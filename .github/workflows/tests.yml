name: Tests & Lint

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repo
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Node 22
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org/

            - name: Setup PNPM
              uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
              with:
                  version: 9.11.0

            - name: Install deps
              run: pnpm install --frozen-lockfile

            - name: Build package
              run: pnpm package

            - name: Lint
              run: pnpm lint

            # - name: Astro & Svelte Check
            #   run: pnpm check

    tests:
        name: Test
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [18, 20, 22]
        steps:
            - name: Checkout Repo
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

            - name: Setup Node ${{ matrix.node }}
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: ${{ matrix.node }}
                  registry-url: https://registry.npmjs.org/

            - name: Setup PNPM
              uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
              with:
                  version: 9.11.0

            - name: Install deps
              run: pnpm install --frozen-lockfile

            - name: Build package
              run: pnpm package

            - name: Test
              run: pnpm test
